<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蔡佩穎｜閱讀心得</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <nav id="site-nav"></nav>
  <script src="nav.js?v=1"></script>

  <section>
    <h2>閱讀心得</h2>
    <p>點選書本封面，看看我的閱讀心得 📚</p>

    <!-- 書架會依 data-date 自動排序，越晚讀完的排越前面 -->
    <div class="bookshelf" id="bookshelf">

      <button class="book-cover" data-date="2026-09" onclick="document.getElementById('book1').showModal()">
        <img src="books/The_Let_Them.jpg" alt="隨他們去 The Let Them 封面">
        <span>隨他們去</span>
        <span class="stars">⭐️⭐️⭐️⭐️⭐️</span>
      </button>

      <button class="book-cover" data-date="2025-04" onclick="document.getElementById('book2').showModal()">
        <img src="books/Jungian%20Psychology.jpg" alt="榮格心理學入門 封面">
        <span>榮格心理學入門</span>
        <span class="stars">⭐️⭐️⭐️⭐️⭐️</span>
      </button>

    </div>

    <dialog id="book1" class="book-dialog">
      <h3>隨他們去 The Let Them</h3>
      <p class="book-info">作者：梅爾．羅賓斯（Mel Robbins）｜閱讀日期：2026/09</p>
      <p>在這裡寫你的心得。</p>
      <form method="dialog"><button class="close-btn">關閉</button></form>
    </dialog>

    <dialog id="book2" class="book-dialog">
      <h3>榮格心理學入門：自我重生的人生旅程</h3>
      <p class="book-info">作者：山根久美子｜閱讀日期：2025/04</p>
      <p>在這裡寫你的心得。</p>
      <form method="dialog"><button class="close-btn">關閉</button></form>
    </dialog>

  </section>

  <script>
    // 依閱讀日期自動排序：越晚讀完的排越前面
    var shelf = document.getElementById("bookshelf");
    var books = Array.from(shelf.querySelectorAll(".book-cover"));
    books.sort(function (a, b) {
      return b.dataset.date.localeCompare(a.dataset.date);
    });
    books.forEach(function (book) { shelf.appendChild(book); });

    // 點視窗外面也能關閉
    document.querySelectorAll("dialog").forEach(function (d) {
      d.addEventListener("click", function (e) {
        if (e.target === d) d.close();
      });
    });
  </script>

    <footer id="site-footer"></footer>
  <script src="footer.js?v=1"></script>
</body>
</html>
