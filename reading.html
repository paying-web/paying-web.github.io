<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蔡佩穎｜閱讀心得</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <nav>
    <a href="index.html">首頁</a>
    <a href="about.html">關於我</a>
    <a href="resume.html">個人履歷</a>
    <a href="works.html">作品集</a>
    <a href="reading.html">閱讀心得</a>
    <a href="contact.html">聯絡我</a>
  </nav>

  <section>
    <h2>閱讀心得</h2>
    <p>點選書本封面，看看我的閱讀心得 📚</p>

    <div class="bookshelf">
      <!-- 新書請貼在這一行下面，最上面的會排第一個 -->

      <button class="book-cover" onclick="document.getElementById('book2').showModal()">
        <img src="books/Jungian%20Psychology.jpg" alt="榮格心理學入門 封面">
        <span>榮格心理學入門</span>
        <span class="stars">⭐️⭐️⭐️⭐️⭐️</span>
      </button>

      <button class="book-cover" onclick="document.getElementById('book1').showModal()">
        <img src="books/The_Let_Them.jpg" alt="隨他們去 The Let Them 封面">
        <span>隨他們去</span>
        <span class="stars">⭐️⭐️⭐️⭐️⭐️</span>
      </button>

    </div>

    <dialog id="book1" class="book-dialog">
      <h3>隨他們去 The Let Them</h3>
      <p class="book-info">作者：梅爾．羅賓斯（Mel Robbins）｜閱讀日期：2026/09</p>
      <p>在這裡寫你的心得。</p>
      <form method="dialog"><button class="close-btn">關閉</button></form>
    </dialog>

    <dialog id="book2" class="book-dialog">
      <h3>榮格心理學入門：自我重生的人生旅程</h3>
      <p class="book-info">作者：山根久美子｜閱讀日期：2025/04</p>
      <p>在這裡寫你的心得。</p>
      <form method="dialog"><button class="close-btn">關閉</button></form>
    </dialog>

  </section>

  <script>
    document.querySelectorAll("dialog").forEach(function (d) {
      d.addEventListener("click", function (e) {
        if (e.target === d) d.close();
      });
    });
  </script>

</body>
</html>
