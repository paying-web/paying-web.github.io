<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蔡佩穎｜生活相簿</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

  <nav>
    <a href="index.html">首頁</a>
    <a href="about.html">關於我</a>
    <a href="resume.html">個人履歷</a>
    <a href="works.html">作品集</a>
    <details class="dropdown">
      <summary>其他 ▾</summary>
      <div class="dropdown-menu">
        <a href="reading.html">閱讀心得</a>
        <a href="album.html">生活相簿</a>
      </div>
    </details>
    <a href="contact.html">聯絡我</a>
  </nav>

  <section>
    <h2>生活相簿</h2>
    <p>點選照片，看看更多生活中的回憶 📷</p>

    <!-- 相簿封面：新的相簿貼在這一行下面，最上面的排第一個 -->
    <div class="album-grid">

      <button class="album-cover" onclick="document.getElementById('album1').showModal()">
        <img src="photos/album1/cover.jpg" alt="相簿標題">
        <span>相簿標題</span>
        <small>2026/10</small>
      </button>

    </div>

    <!-- 相簿內容：每本相簿一個 -->
    <dialog id="album1" class="album-dialog">
      <h3>相簿標題</h3>
      <p class="book-info">2026/10｜地點</p>
      <p>在這裡寫這次的故事或心情。</p>

      <div class="gallery">
        <img src="photos/album1/1.jpg" alt="">
        <img src="photos/album1/2.jpg" alt="">
        <img src="photos/album1/3.jpg" alt="">
      </div>

      <form method="dialog"><button class="close-btn">關閉</button></form>
    </dialog>

  </section>

  <script>
    document.querySelectorAll("dialog").forEach(function (d) {
      d.addEventListener("click", function (e) {
        if (e.target === d) d.close();
      });
    });
  </script>

</body>
</html>
